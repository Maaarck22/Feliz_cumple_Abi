<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz cumpleaños, Abi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF1EA; --bg2:#FBD3C8; --ink:#3B2340; --ink-soft:#6E5272;
    --paper:#FFFDF9; --env:#F4B9AE; --env-dark:#E59A8D; --flap:#F9CCC2;
    --accent:#E8705F; --gold:#D9A441; --shadow:rgba(59,35,64,.22);
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#241628; --bg2:#432548; --ink:#FBEFE9; --ink-soft:#D9C3D9;
      --paper:#33213A; --env:#C9788B; --env-dark:#A55A72; --flap:#DA8F9F;
      --accent:#FF8E7A; --gold:#F0C060; --shadow:rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#241628; --bg2:#432548; --ink:#FBEFE9; --ink-soft:#D9C3D9;
    --paper:#33213A; --env:#C9788B; --env-dark:#A55A72; --flap:#DA8F9F;
    --accent:#FF8E7A; --gold:#F0C060; --shadow:rgba(0,0,0,.5);
    color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  body{
    margin:0; color:var(--ink); font-family:'Inter',system-ui,sans-serif;
    background-color:var(--bg);
    background-image:radial-gradient(ellipse at 50% 0%, var(--bg2), transparent 65%);
    overflow-x:hidden;
  }
  .scene{
    position:relative; overflow:hidden;
    min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
    display:grid; place-items:center; padding:28px 18px;
  }
  .stage{ position:relative; z-index:2; display:grid; place-items:center; width:100%; }
  .stage > *{ grid-area:1/1; }

  /* balloons */
  .balloon{
    position:absolute; bottom:-90px; width:46px; height:58px; opacity:.55;
    border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;
    animation:rise var(--d,18s) linear var(--delay,0s) infinite; z-index:1;
  }
  .balloon::after{ content:""; position:absolute; left:50%; top:100%; width:1px; height:46px; background:var(--ink-soft); opacity:.5; }
  .b1{ left:8%; background:#F4A3A0; --d:19s; }
  .b2{ left:24%; background:#F7CE76; --d:23s; --delay:-8s; width:38px; height:48px; }
  .b3{ left:48%; background:#A9D6C9; --d:21s; --delay:-14s; }
  .b4{ left:70%; background:#C7B1E8; --d:25s; --delay:-4s; width:40px; height:50px; }
  .b5{ left:88%; background:#F4A3A0; --d:20s; --delay:-11s; }
  @keyframes rise{
    0%{ transform:translate(0,0); }
    50%{ transform:translate(14px,-60vh); }
    100%{ transform:translate(-8px,-125vh); }
  }

  /* envelope */
  .envwrap{ display:grid; justify-items:center; gap:1.6rem; transition:opacity .6s ease, transform 1s ease, visibility 0s 1s; }
  .scene.opened .envwrap{ opacity:0; transform:translateY(60vh) rotate(-4deg); visibility:hidden; pointer-events:none; }
  .envelope{
    position:relative; width:min(86vw,380px); aspect-ratio:3/2; perspective:900px;
    filter:drop-shadow(0 18px 22px var(--shadow)); cursor:pointer;
    animation:float 4s ease-in-out infinite;
  }
  .envelope.open{ animation:none; }
  @keyframes float{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-8px);} }
  .env-back{ position:absolute; inset:0; background:var(--env-dark); border-radius:10px; }
  .paper{
    position:absolute; left:6%; right:6%; top:10%; bottom:6%; z-index:2;
    background:var(--paper); border-radius:6px; display:grid; place-items:center;
    font-family:'Caveat',cursive; font-size:1.7rem; color:var(--accent);
    transition:transform .9s cubic-bezier(.2,.8,.2,1) .5s;
  }
  .envelope.open .paper{ transform:translateY(-62%); }
  .env-front{
    position:absolute; inset:0; z-index:3; background:var(--env); border-radius:10px;
    clip-path:polygon(0 0, 50% 60%, 100% 0, 100% 100%, 0 100%);
  }
  .to{
    position:absolute; z-index:4; left:0; right:0; bottom:11%; text-align:center;
    font-family:'Caveat',cursive; font-size:clamp(1.5rem,6vw,2rem); color:var(--ink);
  }
  .flap{
    position:absolute; left:0; right:0; top:0; height:60%; z-index:5;
    background:var(--flap); clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top; transition:transform .7s ease, z-index 0s .35s; border-radius:10px 10px 0 0;
  }
  .envelope.open .flap{ transform:rotateX(180deg); z-index:1; }
  .seal{
    position:absolute; z-index:6; left:50%; top:60%; width:58px; height:58px;
    transform:translate(-50%,-50%); border:0; border-radius:50%; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #F08A78, #C9493A 70%);
    color:#FFF3EE; font-family:'Fraunces',serif; font-style:italic; font-weight:600; font-size:1.7rem;
    box-shadow:0 4px 10px rgba(0,0,0,.28), inset 0 -3px 6px rgba(0,0,0,.18);
    transition:transform .4s ease, opacity .3s ease;
  }
  .seal::before{
    content:""; position:absolute; inset:-8px; border-radius:50%;
    border:2px solid var(--accent); opacity:.6; animation:ring 2s ease-out infinite;
  }
  @keyframes ring{ from{ transform:scale(.8); opacity:.7; } to{ transform:scale(1.35); opacity:0; } }
  .envelope.open .seal{ transform:translate(-50%,-50%) scale(0); opacity:0; }
  .hint{ font-size:.92rem; color:var(--ink-soft); letter-spacing:.02em; margin:0; }

  /* card */
  .card{
    width:min(92vw,460px); background:var(--paper); border-radius:24px; padding:2.2rem 1.6rem 2rem;
    text-align:center; box-shadow:0 24px 50px -20px var(--shadow);
    opacity:0; transform:translateY(40px) scale(.92); pointer-events:none;
    transition:opacity .9s ease .35s, transform .9s cubic-bezier(.2,.8,.2,1) .35s;
  }
  .scene.opened .card{ opacity:1; transform:none; pointer-events:auto; }
  .eyebrow{ margin:0 0 .8rem; font-size:.72rem; letter-spacing:.3em; text-transform:uppercase; color:var(--accent); font-weight:600; }
  h1{
    font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:clamp(1.9rem,8vw,2.6rem);
    line-height:1.1; margin:0 0 1rem; color:var(--ink);
  }
  h1 em{ color:var(--accent); font-style:italic; }
  .orn{ color:var(--gold); letter-spacing:.5em; margin:0 0 1.1rem; font-size:.9rem; }
  .card p.msg{ margin:0 0 .9rem; line-height:1.65; color:var(--ink-soft); font-size:1rem; }
  .sign{ font-family:'Caveat',cursive; font-size:1.9rem; color:var(--accent); margin:1.1rem 0 0; }
  .card > *{ opacity:0; transform:translateY(10px); }
  .scene.opened .card > *{ animation:up .7s ease forwards; }
  .scene.opened .card > *:nth-child(1){ animation-delay:.9s; }
  .scene.opened .card > *:nth-child(2){ animation-delay:1.05s; }
  .scene.opened .card > *:nth-child(3){ animation-delay:1.2s; }
  .scene.opened .card > *:nth-child(4){ animation-delay:1.35s; }
  .scene.opened .card > *:nth-child(5){ animation-delay:1.5s; }
  .scene.opened .card > *:nth-child(6){ animation-delay:1.65s; }
  .scene.opened .card > *:nth-child(7){ animation-delay:1.8s; }
  .scene.opened .card > *:nth-child(8){ animation-delay:1.95s; }
  @keyframes up{ to{ opacity:1; transform:none; } }

  /* confetti */
  .confetti{ position:fixed; top:-14px; z-index:50; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall{
    to{ transform:translate(var(--dx,0), 108vh) rotate(var(--rot,540deg)); opacity:.9; }
  }

  @media (prefers-reduced-motion: reduce){
    .balloon, .envelope, .seal::before{ animation:none; }
    .card, .card > *{ transition:none; animation:none !important; opacity:1; transform:none; }
    .scene:not(.opened) .card{ opacity:0; }
    .paper, .flap, .envwrap{ transition:none; }
  }
</style>
</head>
<body>
<main class="scene" id="scene">
  <span class="balloon b1" aria-hidden="true"></span>
  <span class="balloon b2" aria-hidden="true"></span>
  <span class="balloon b3" aria-hidden="true"></span>
  <span class="balloon b4" aria-hidden="true"></span>
  <span class="balloon b5" aria-hidden="true"></span>

  <div class="stage">
    <div class="envwrap">
      <div class="envelope" id="envelope">
        <div class="env-back"></div>
        <div class="paper">Feliz cumpleaños</div>
        <div class="env-front"></div>
        <div class="to">Para Abi</div>
        <div class="flap"></div>
        <button class="seal" id="seal" type="button" aria-label="Abrir el sobre">A</button>
      </div>
      <p class="hint">Toca el sello para abrir</p>
    </div>

    <article class="card" aria-live="polite">
      <p class="eyebrow">Hoy es tu día</p>
      <h1>Feliz cumpleaños,<br><em>Abigail</em></h1>
      <p class="orn" aria-hidden="true">✦ ✦ ✦</p>
      <p class="msg">Hoy es tu día,</p>
      <p class="msg">Que este año te regale calma cuando la necesites, risas de las buenas y motivos de sobra para sentirte orgullosa de ti.</p>
      <p class="msg">¡Disfruta muchísimo tu día!</p>
      <p class="sign">Con mucho cariño</p>
    </article>
  </div>
</main>

<script>
  var scene = document.getElementById('scene');
  var envelope = document.getElementById('envelope');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var colors = ['#E8705F','#F7CE76','#A9D6C9','#C7B1E8','#F4A3A0','#D9A441'];
  var opened = false;

  function confetti(n){
    if (reduce) return;
    for (var i = 0; i < n; i++){
      (function(i){
        setTimeout(function(){
          var c = document.createElement('span');
          c.className = 'confetti';
          var w = 6 + Math.random() * 7;
          c.style.width = w + 'px';
          c.style.height = (w * (Math.random() > .5 ? 1 : 1.8)) + 'px';
          c.style.background = colors[Math.floor(Math.random() * colors.length)];
          c.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
          c.style.left = (Math.random() * 100) + 'vw';
          c.style.setProperty('--dx', ((Math.random() - .5) * 160) + 'px');
          c.style.setProperty('--rot', ((Math.random() > .5 ? 1 : -1) * (360 + Math.random() * 500)) + 'deg');
          c.style.animationDuration = (2.6 + Math.random() * 2.2) + 's';
          document.body.appendChild(c);
          c.addEventListener('animationend', function(){ c.remove(); });
        }, i * 28);
      })(i);
    }
  }

  function openEnvelope(){
    if (opened) return;
    opened = true;
    envelope.classList.add('open');
    setTimeout(function(){
      scene.classList.add('opened');
      confetti(70);
    }, reduce ? 0 : 1500);
  }

  envelope.addEventListener('click', openEnvelope);

</script>
</body>
</html>
